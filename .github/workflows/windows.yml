name: Windows CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Route vcpkg's binary caching through the GitHub Actions cache (free on public repos).
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - x64-debug
          - x64-release
          - x86-debug
          - x86-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GHA cache creds for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ startsWith(matrix.preset, 'x64') && 'amd64' || 'x86' }}

      - name: Set up CMake >= 3.30
        uses: lukka/get-cmake@latest

      - name: Restore our own VCPKG_ROOT
        # msvc-dev-cmd's vcvarsall sets VCPKG_ROOT to the VS-bundled vcpkg and
        # exports it via GITHUB_ENV, clobbering the job-level env above.
        shell: pwsh
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run tests
        run: cmake --build --preset "${{ matrix.preset }}" --target sqlite_wrapper.run_all_tests