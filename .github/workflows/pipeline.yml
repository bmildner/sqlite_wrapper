name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Route vcpkg's binary caching through the GitHub Actions cache (free on public repos).
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    name: "[${{ matrix.platform }}] ${{ matrix.preset }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux,   os: ubuntu-latest,  preset: linux-debug }
          - { platform: Linux,   os: ubuntu-latest,  preset: linux-release }
          - { platform: Linux,   os: ubuntu-latest,  preset: linux-debug-newest-toolset }
          - { platform: Linux,   os: ubuntu-latest,  preset: linux-release-newest-toolset }
          - { platform: Windows, os: windows-latest, preset: x64-debug,   arch: amd64 }
          - { platform: Windows, os: windows-latest, preset: x64-release, arch: amd64 }
          - { platform: Windows, os: windows-latest, preset: x86-debug,   arch: x86 }
          - { platform: Windows, os: windows-latest, preset: x86-release, arch: x86 }

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up GHA cache creds for vcpkg
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install base build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache mold doxygen graphviz pipx

      - name: Install default toolchain
        if: runner.os == 'Linux' && !contains(matrix.preset, 'newest-toolset')
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-tidy-20

      - name: Install newest toolchain
        if: runner.os == 'Linux' && contains(matrix.preset, 'newest-toolset')
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-tidy-21

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
        with:
          arch: ${{ matrix.arch }}

      - name: Set up CMake >= 3.30
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3

      - name: Restore our own VCPKG_ROOT
        # msvc-dev-cmd's vcvarsall sets VCPKG_ROOT to the VS-bundled vcpkg and
        # exports it via GITHUB_ENV, clobbering the job-level env above.
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV

      - name: Install gcovr
        if: runner.os == 'Linux'
        run: pipx install "gcovr>=8.4"

      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.preset }}-

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Build documentation
        if: runner.os == 'Linux'
        run: cmake --build --preset "${{ matrix.preset }}" --target sqlite_wrapper.build_documentation

      - name: Workaround ASan/ASLR incompatibility
        if: runner.os == 'Linux' && contains(matrix.preset, 'debug')
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run tests + coverage gate (debug)
        if: runner.os == 'Linux' && contains(matrix.preset, 'debug')
        run: |
          cmake --build --preset "${{ matrix.preset }}" --target sqlite_wrapper.coverage_report 2>&1 | tee cov.log
          LINE=$(grep 'TOTAL' cov.log | tail -1 | awk '{print $NF}' | tr -d '%')
          if [ -z "$LINE" ]; then
            echo "ERROR: could not parse line coverage from gcovr output"
            exit 1
          fi
          echo "Line coverage: ${LINE}%"
          awk -v c="$LINE" 'BEGIN { if (c + 0 < 90) { print "ERROR: line coverage " c "% is below 90% threshold"; exit 1 } }'

      - name: Run tests (release)
        if: runner.os == 'Linux' && contains(matrix.preset, 'release')
        run: cmake --build --preset "${{ matrix.preset }}" --target sqlite_wrapper.run_all_tests

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cmake --build --preset "${{ matrix.preset }}" --target sqlite_wrapper.run_all_tests
